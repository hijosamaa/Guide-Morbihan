version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CRON_SECRET=${CRON_SECRET}
    restart: unless-stopped
    # depends_on:
    #   - db # Optionnel : décommenter si conteneur db local utilisé au lieu de Supabase Cloud distant (DATABASE_URL)

  # Service optionnel si bascule locale ou VPS sans Supabase Cloud
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: morbihan-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: morbihan_guide
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
